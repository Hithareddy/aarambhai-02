<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aarambh AI — You are Offline</title>
  <style>
    :root {
      --bg: #1e1b4b;
      --card: #2e2a85;
      --primary: #4f46e5;
      --accent: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .icon-badge {
      width: 4.5rem;
      height: 4.5rem;
      background: var(--primary);
      border-radius: 1.25rem;
      display: grid;
      place-items: center;
      margin: 0 auto 1.5rem auto;
      box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .notice {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 0.875rem;
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.875rem 1.5rem;
      border-radius: 0.875rem;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You are Offline</h1>
    <p>An active internet connection is required to submit assessments, communicate with the AI Tutor, or perform Admin actions.</p>
    
    <div class="notice">
      💡 <strong>Note:</strong> Safe cached pages and lessons will automatically load when available.
    </div>

    <button class="btn" onclick="window.location.reload()">
      Retry Connection
    </button>
  </div>
</body>
</html>
